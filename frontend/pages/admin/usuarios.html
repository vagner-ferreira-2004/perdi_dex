<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Usuários</title>
        <link type="image/x-icon" rel="shortcut icon" href="../../src/images/logos/icon-logo.ico">
    
        <!-- CSS -->
        <link rel="stylesheet" href="../../src/css/global/global.css">
        <link rel="stylesheet" href="../../src/css/components/menu.css">
        <link rel="stylesheet" href="../../src/css/pages/usuarios-admin.css">
    </head>
    <body>
        <!-- MENU LATERAL FIXO -->
        <menu-admin></menu-admin>

        <!-- MAIN -->
        <main class="usuarios-admin">
            <header class="usuarios-cabecalho">
                <div>
                    <h1>Usuários</h1>
                    <p>Consulte as contas ativas e desative acessos quando necessário.</p>
                </div>
                <span id="totalUsuarios" aria-live="polite">Carregando...</span>
            </header>
            <p id="mensagemUsuarios" role="status" aria-live="polite"></p>
            <div class="tabela-usuarios-wrap">
                <table class="tabela-usuarios">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Permissão</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="listaUsuarios"></tbody>
                </table>
            </div>
            <nav class="paginacao-usuarios" aria-label="Paginação de usuários">
                <button type="button" id="usuariosAnterior" disabled>Anterior</button>
                <span id="paginaUsuarios">Página 1</span>
                <button type="button" id="usuariosProxima" disabled>Próxima</button>
            </nav>
        </main>
        
        
        <!-- JS -->
        <script src="../../src/js/global/api.js"></script>
        <script src="../../src/js/global/auth-session.js"></script>
        <script src="../../src/js/pages/usuarios-admin.js"></script>
        <script type="module" src="../../src/js/global/font-awesome.js"></script>
        <script type="module" src="../../src/js/components/menu.js"></script>
    </body>
</html>
